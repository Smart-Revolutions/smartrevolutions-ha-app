# Paste as a manual Lovelace card. Create input_number.sr_support_minutes
# first, via Settings > Devices & services > Helpers (min 1, max 1440, step 1).
type: vertical-stack
cards:
  - type: markdown
    content: '## Snartrevolutions beheer\nTijdelijke beheerderstoegang'
  - type: grid
    columns: 2
    square: false
    cards:
      - type: button
        name: 30 minuten
        icon: mdi:timer-outline
        tap_action:
          action: perform-action
          perform_action: snartrevolutions_beheer.activate
          data: {minutes: 30}
      - type: button
        name: 1 uur
        icon: mdi:timer-outline
        tap_action:
          action: perform-action
          perform_action: snartrevolutions_beheer.activate
          data: {minutes: 60}
      - type: button
        name: 4 uur
        icon: mdi:timer-outline
        tap_action:
          action: perform-action
          perform_action: snartrevolutions_beheer.activate
          data: {minutes: 240}
      - type: button
        name: 24 uur
        icon: mdi:timer-outline
        tap_action:
          action: perform-action
          perform_action: snartrevolutions_beheer.activate
          data: {minutes: 1440}
  - type: entities
    entities:
      - entity: input_number.sr_support_minutes
        name: Aangepast (minuten)
  - type: button
    name: Activeer aangepaste duur
    icon: mdi:shield-check
    tap_action:
      action: perform-action
      perform_action: script.sr_activate_custom
  - type: button
    name: Trek toegang direct in
    icon: mdi:shield-off
    tap_action:
      action: perform-action
      perform_action: snartrevolutions_beheer.revoke
